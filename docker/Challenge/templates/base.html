<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Docker Challenge - Building a Multi-Container Application{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="logo">
                <span class="logo-icon">+1</span>
                Docker Challenge - Building a Multi-Container Application
            </a>
            <nav>
                <a href="/" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
                <a href="/count" class="{% if active_page == 'count' %}active{% endif %}">Count</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            Flask &amp; Redis &middot; Docker Challenge - Building a Multi-Container Application
        </footer>
    </div>
</body>
</html>
