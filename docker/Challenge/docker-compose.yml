version: '3.8'

services:
  
  web-app:
    build: .
    expose:
      - "5000" 
    depends_on:
      - redis-db     
    environment:
      - REDIS_HOST=redis-db
      - REDIS_PORT=6379

  redis-db:
    image: "redis:alpine" 
    ports:
      - "6379:6379" 
    volumes:
      - redis-data:/data 
  
  nginx:
    image: nginx:latest
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web-app

volumes:
  redis-data:
